name: Build SerikaOS ISO

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ISO
    runs-on: blacksmith
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache AUR Packages
        uses: actions/cache@v4
        with:
          path: out/packages
          key: ${{ runner.os }}-aur-packages-${{ hashFiles('archiso-profile/packages.x86_64', 'archiso-profile/packages-live.x86_64') }}
          restore-keys: |
            ${{ runner.os }}-aur-packages-

      - name: Build ISO inside Docker
        run: |
          sudo bash build-docker-iso.sh

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: serikaos-iso
          path: out/serikaos-*.iso
          if-no-files-found: error
          retention-days: 7

      - name: Delete old tag and release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "nightly" --cleanup-tag -y || true
          git tag -d "nightly" || true

      - name: Create or Update Nightly Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "SerikaOS Nightly Build"
          body: |
            This is an automated nightly build of SerikaOS.
            
            **Commit**: `${{ github.sha }}`
            **Built on**: `${{ github.event.head_commit.timestamp || 'Manual Dispatch' }}`
          prerelease: true
          files: |
            out/serikaos-*.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
